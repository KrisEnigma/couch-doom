name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install --no-deps tinysoundfont

      - name: Build
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/CouchDoom.spec

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          Copy-Item "packaging/How to use.txt", LICENSE dist/CouchDoom/
          $zip = "CouchDoom-$version-windows-x64.zip"
          Compress-Archive dist/CouchDoom $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: CouchDoom-windows-x64
          path: ${{ steps.pkg.outputs.zip }}

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "${{ steps.pkg.outputs.zip }}" --title "CouchDoom ${{ github.ref_name }}" --notes-file packaging/release-notes.md
