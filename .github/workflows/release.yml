name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-arm64
          # GitHub's Intel Mac runner; Intel Macs top out at macOS 26, so this target has a limited lifespan.
          - os: macos-15-intel
            target: macos-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: ${{ !startsWith(matrix.target, 'linux') }}
        with:
          python-version: "3.14"

      # A PyInstaller build only runs on glibc as new as the newest symbol it bundles. The runner's own Python is
      # built against glibc 2.35, but uv's python-build-standalone targets glibc 2.17, so the app runs on far older distros.
      - uses: astral-sh/setup-uv@v10.2.0
        if: ${{ startsWith(matrix.target, 'linux') }}

      - name: Portable Python (Linux)
        if: ${{ startsWith(matrix.target, 'linux') }}
        run: |
          uv venv --python 3.14 --managed-python --seed .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install
        shell: bash
        run: |
          python -m pip install -r requirements.txt pyinstaller pillow
          python -m pip install --no-deps tinysoundfont || echo "No tinysoundfont for this platform: MIDI title music is left out"

      - name: Build
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/CouchDoom.spec

      - name: Check the glibc floor (Linux)
        if: ${{ startsWith(matrix.target, 'linux') }}
        run: |
          floor=$(find dist -type f \( -name '*.so*' -o -name CouchDoom \) -exec objdump -T {} + 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "Newest glibc symbol the build needs: $floor"
          echo "glibc floor: $floor" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(printf '%s\n2.28\n' "$floor" | sort -V | tail -1)" != "2.28" ]; then
            echo "Files needing more than 2.28:" >&2
            find dist -type f \( -name '*.so*' -o -name CouchDoom \) | while read -r f; do
              v=$(objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
              [ -n "$v" ] && [ "$(printf '%s\n2.28\n' "$v" | sort -V | tail -1)" != "2.28" ] && echo "  $v  $f" >&2
            done
            echo "Build needs glibc $floor, newer than the 2.28 we promise" >&2
            exit 1
          fi

      - name: Package
        id: pkg
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="dev-${GITHUB_SHA::7}"; fi
          name="CouchDoom-$version-${{ matrix.target }}"
          mkdir -p "stage/CouchDoom"
          case "${{ matrix.target }}" in
            windows-x64)
              cp -R dist/CouchDoom/. stage/CouchDoom/
              cp "packaging/How to use.txt" LICENSE stage/CouchDoom/
              (cd stage && 7z a -tzip "../$name.zip" CouchDoom >/dev/null)
              echo "file=$name.zip" >> "$GITHUB_OUTPUT" ;;
            macos-*)
              cp -R dist/CouchDoom.app stage/CouchDoom/
              cp "packaging/How to use.txt" LICENSE stage/CouchDoom/
              # ditto keeps the bundle's symlinks and ad-hoc signature intact; plain zip breaks them.
              ditto -c -k --keepParent stage/CouchDoom "$name.zip"
              echo "file=$name.zip" >> "$GITHUB_OUTPUT" ;;
            linux-*)
              cp -R dist/CouchDoom/. stage/CouchDoom/
              cp "packaging/How to use.txt" LICENSE stage/CouchDoom/
              tar -C stage -czf "$name.tar.gz" CouchDoom
              echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: CouchDoom-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.file }}

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: Write this release's notes
        run: |
          # Download instructions, then only this tag's section of CHANGELOG.md (not the whole history).
          version="${GITHUB_REF_NAME#v}"
          section=$(awk -v h="**New in $version**" '/^\*\*New in /{p=($0==h)} p' CHANGELOG.md)
          if [ -z "$section" ]; then
            echo "CHANGELOG.md has no '**New in $version**' section" >&2
            exit 1
          fi
          {
            cat packaging/release-header.md
            printf '\n%s\n\n' "$section"
            echo 'See `How to use.txt` in the download for controls and optional MIDI music setup.'
          } > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --title "CouchDoom $GITHUB_REF_NAME" --notes-file notes.md
