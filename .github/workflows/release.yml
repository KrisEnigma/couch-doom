name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-arm64
          # The oldest supported runner: a PyInstaller build only runs on glibc as new as the one it was built on.
          - os: ubuntu-22.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        shell: bash
        run: |
          python -m pip install -r requirements.txt pyinstaller pillow
          python -m pip install --no-deps tinysoundfont || echo "No tinysoundfont for this platform: MIDI title music is left out"

      - name: Build
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/CouchDoom.spec

      - name: Package
        id: pkg
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="dev-${GITHUB_SHA::7}"; fi
          name="CouchDoom-$version-${{ matrix.target }}"
          mkdir -p "stage/CouchDoom"
          case "${{ matrix.target }}" in
            windows-x64)
              cp -R dist/CouchDoom/. stage/CouchDoom/
              cp "packaging/How to use.txt" LICENSE stage/CouchDoom/
              (cd stage && 7z a -tzip "../$name.zip" CouchDoom >/dev/null)
              echo "file=$name.zip" >> "$GITHUB_OUTPUT" ;;
            macos-arm64)
              cp -R dist/CouchDoom.app stage/CouchDoom/
              cp "packaging/How to use.txt" LICENSE stage/CouchDoom/
              # ditto keeps the bundle's symlinks and ad-hoc signature intact; plain zip breaks them.
              ditto -c -k --keepParent stage/CouchDoom "$name.zip"
              echo "file=$name.zip" >> "$GITHUB_OUTPUT" ;;
            linux-x64)
              cp -R dist/CouchDoom/. stage/CouchDoom/
              cp "packaging/How to use.txt" LICENSE stage/CouchDoom/
              tar -C stage -czf "$name.tar.gz" CouchDoom
              echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: CouchDoom-${{ matrix.target }}
          path: ${{ steps.pkg.outputs.file }}

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: Write this release's notes
        run: |
          # Download instructions, then only this tag's section of CHANGELOG.md (not the whole history).
          version="${GITHUB_REF_NAME#v}"
          section=$(awk -v h="**New in $version**" '/^\*\*New in /{p=($0==h)} p' CHANGELOG.md)
          if [ -z "$section" ]; then
            echo "CHANGELOG.md has no '**New in $version**' section" >&2
            exit 1
          fi
          {
            cat packaging/release-header.md
            printf '\n%s\n\n' "$section"
            echo 'See `How to use.txt` in the download for controls and optional MIDI music setup.'
          } > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --title "CouchDoom $GITHUB_REF_NAME" --notes-file notes.md
